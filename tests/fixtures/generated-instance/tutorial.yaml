bundle_format: 1
id: rust-cli-basics
title: Rust Fundamentals Through a Command-Line Tool
description: >
  Core Rust taught by building `tally`, a small command-line tool that counts
  the lines or the words in a text file. Arguments, one subcommand dispatch,
  errors with Result, and a unit test.
subjects: [rust, cli, command-line, error-handling, testing]
aliases: [argv, subcommand, rust-basics, first-rust-program, beginner-rust]
level: beginner
style: [project-driven, interactive, short-form]

lessons:
  - lessons/00-hello-args.md
  - lessons/01-subcommands/LESSON.md
  - lessons/02-errors-and-tests.md

workspace_kind: new-repository
tutor_owned:    [tutorial/STATE.md, tutorial/DESIGN.md]
learner_owned:  [src/**, tests/**, Cargo.toml]
ownership_policy: tutor-must-not-edit-learner-owned

validators:
  cargo-check:    { kind: command, command: [cargo, check] }
  cargo-test:     { kind: command, command: [cargo, test] }
  has-test:       { kind: file-contains, path: src/main.rs, pattern: "#\\[test\\]" }
  explains-choice: { kind: manual }

one_task_at_a_time: true
solution_code: on-request-only
advance_on: validated-evidence-only

instance:
  materialized_from: local:../tests/fixtures/rust-cli-basics
  materialized_at: 2026-09-11
  runner_version: 1

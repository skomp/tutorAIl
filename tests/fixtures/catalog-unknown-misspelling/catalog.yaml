# A catalogue with one misspelled field, and nothing else wrong.
#
# `optional_lesson_cnt` is the exact mistake issue #18 was filed for. It is
# two characters from `optional_lesson_count`, so the runner reads the entry,
# does not recognise the name, and ignores it. The course then advertises no
# optional lessons at all, and before check 3 nothing told anybody.
#
# The catalogue MUST still pass. An unknown field is a warning, never a
# finding: a catalogue is data a newer runner may extend, and an older reader
# degrades rather than refusing - bundle-format.md section 13.
#
# The bundle path names a real bundle fixture next to this directory, so the
# run reaches exit 0 rather than stopping at check 6. That is deliberate:
# this fixture asserts a warning DOES NOT change the exit code, which a
# catalogue that already failed could not show.

catalog_version: 1
tutorials:
  - id: rust-cli-basics
    title: Build a Command-Line Tool in Rust
    description: >
      A short project-driven course that builds a small command-line tool,
      with three main lessons and a few offered beside them.
    subjects: [rust, command-line-tools]
    aliases: [cli, argument-parsing]
    level: beginner
    style: [project-driven]
    scope: "3 lessons; an afternoon"
    optional_lesson_cnt: 3
    workspace_kind: new-repository
    source:
      type: local
      path: ../rust-cli-basics
